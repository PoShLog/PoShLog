@version: 4.8
options { flush-lines(1); threaded(yes); };
source s_udp { syslog(ip("0.0.0.0") port(514) transport("udp")); };
source s_tcp { syslog(ip("0.0.0.0") port(601) transport("tcp")); };
source s_tls { syslog(ip("0.0.0.0") port(6514) transport("tls") tls(key-file("/certs/server.key") cert-file("/certs/server.crt") peer-verify(optional-untrusted))); };
template t_json { template("$(format-json --scope rfc5424 --scope sdata PRI=${PRI} MESSAGE=${MESSAGE})\n"); };
destination d_udp { file("/output/udp.jsonl" template(t_json)); };
destination d_tcp { file("/output/tcp.jsonl" template(t_json)); };
destination d_tls { file("/output/tls.jsonl" template(t_json)); };
log { source(s_udp); destination(d_udp); };
log { source(s_tcp); destination(d_tcp); };
log { source(s_tls); destination(d_tls); };
