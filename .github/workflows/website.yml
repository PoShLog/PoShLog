name: Website

# Builds the documentation website (website/, ADR 0022) on every pull request and push, and on a push to master
# publishes it to the gh-pages branch of PoShLog/PoShLog.github.io. The deploy runs only when the SITE_DEPLOY_KEY
# secret (a deploy key with write access to that repository) exists.

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'codex/**'
      - 'architect/**'
      - 'senior-dev/**'
    paths:
      - 'docs/**'
      - 'extensions/*/README.md'
      - 'CHANGELOG.md'
      - 'src/PoShLog.psd1'
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'extensions/*/README.md'
      - 'CHANGELOG.md'
      - 'src/PoShLog.psd1'
      - 'website/**'
      - '.github/workflows/website.yml'

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      # The sync step fails on a link to a missing file.
      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/dist
          retention-days: 7

  deploy:
    name: Deploy to poshlog.github.io
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}

    steps:
      - name: Skip without a deploy key
        if: env.SITE_DEPLOY_KEY == ''
        run: echo "::notice::SITE_DEPLOY_KEY is not set; the site was built but not deployed."

      - name: Download site
        if: env.SITE_DEPLOY_KEY != ''
        uses: actions/download-artifact@v4
        with:
          name: website
          path: site

      # gh-pages holds only the latest build, so it is replaced on every deploy.
      - name: Push to gh-pages
        if: env.SITE_DEPLOY_KEY != ''
        working-directory: site
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_deploy_key
          chmod 600 ~/.ssh/site_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from PoShLog/PoShLog"
          GIT_SSH_COMMAND='ssh -i ~/.ssh/site_deploy_key -o IdentitiesOnly=yes' \
            git push --force git@github.com:PoShLog/PoShLog.github.io.git gh-pages
