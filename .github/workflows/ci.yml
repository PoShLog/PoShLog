name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'codex/**'
      - 'architect/**'
      - 'senior-dev/**'
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
      - 'feature/**'
      - 'codex/**'

defaults:
  run:
    shell: pwsh

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: dotnet build
        run: dotnet build PoShLog.sln --configuration Release

      - name: dotnet test (xUnit)
        run: >
          dotnet test PoShLog.sln
          --configuration Release
          --no-build
          --logger trx
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Publish xUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: xUnit Tests (${{ matrix.os }})
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload xUnit test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunit-results-${{ matrix.os }}
          path: TestResults/*.trx

      - name: Build PoShLog.Core module assembly
        run: dotnet publish src/dotnet/PoShLog.Core.csproj --configuration Release --output src/lib

      - name: Test clean-process package installation
        if: runner.os == 'Linux'
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Get-Module Microsoft.PowerShell.PSResourceGet -ListAvailable | Where-Object Version -ge ([version]'1.1.0'))) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Repository PSGallery -MinimumVersion 1.1.0 -Scope CurrentUser -Force
          }
          # Stage-Module invokes Build-Extension for each selected extension.
          ./build/Test-PackageInstall.ps1

      - name: Test Install-PoShLogExtension in a clean home
        if: runner.os == 'Linux'
        # Uses the PSResourceGet 1.1+ ensured by the previous step; 1.0.x mis-parses dotted names in a local repository.
        run: ./build/Test-ExtensionInstall.ps1

      - name: Install Pester
        run: |
          # PSResourceGet ships with PowerShell 7.4 and newer; retry because the Gallery fails intermittently.
          foreach ($attempt in 1..3) {
            try {
              Install-PSResource -Name Pester -Version '[5.5.0, 7.0.0)' -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Pester install attempt $attempt failed: $_"
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          Get-Module Pester -ListAvailable | Select-Object Name, Version

      - name: Import PoShLog module
        run: |
          Import-Module "$($PWD)/src/PoShLog.psd1" -Force
          Get-Module PoShLog

      - name: Run Pester tests
        run: |
          $env:TEMP = [IO.Path]::GetTempPath()
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './TestResults/pester-results.xml'
          $result = Invoke-Pester -Configuration $config

          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) {
              throw "$($result.FailedCount) Pester test(s) failed."
          }

      - name: Upload Pester test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: TestResults/pester-results.xml

  minimum-powershell:
    name: Pester (PowerShell 7.6, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Core
        run: dotnet publish src/dotnet/PoShLog.Core.csproj --configuration Release --output src/lib
      - name: Install PowerShell 7.6
        shell: bash
        run: |
          # A relative tool path in a custom shell resolves against the dotnet root, so install to an absolute
          # path and put it first on PATH; the next step checks that it really runs 7.6.
          dotnet tool install PowerShell --version '7.6.*' --tool-path "$RUNNER_TEMP/powershell76"
          echo "$RUNNER_TEMP/powershell76" >> "$GITHUB_PATH"
      - name: Install Pester and run suite under PowerShell 7.6
        shell: 'pwsh -NoLogo -NoProfile -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -ne 7 -or $PSVersionTable.PSVersion.Minor -ne 6) {
            throw 'This job must run PowerShell 7.6.x.'
          }
          foreach ($attempt in 1..3) {
            try {
              Install-PSResource -Name Pester -Version '[5.5.0, 7.0.0)' -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Pester install attempt $attempt failed: $_"
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          $env:TEMP = [IO.Path]::GetTempPath()
          Import-Module Pester -MinimumVersion 5.5.0
          $result = Invoke-Pester ./tests -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }

  macos-smoke:
    name: Module smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and publish Core
        run: dotnet publish src/dotnet/PoShLog.Core.csproj --configuration Release --output src/lib
      - name: Import and log a structured event
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./src/PoShLog.psd1 -Force
          $log = Join-Path ([IO.Path]::GetTempPath()) "poshlog-smoke-$([guid]::NewGuid()).log"
          try {
            Start-Logger -Console -FilePath $log
            Write-InfoLog -MessageTemplate 'Preview {Number} ready' -PropertyValues 2
          } finally {
            Close-Logger
          }
          if (!(Test-Path -LiteralPath $log) -or (Get-Content -LiteralPath $log -Raw) -notmatch 'Preview 2 ready') {
            throw 'The file sink did not contain the rendered structured message.'
          }

  compatibility:
    uses: ./.github/workflows/compat.yml

  recipes:
    uses: ./.github/workflows/recipes.yml
