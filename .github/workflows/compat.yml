name: Compatibility

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  extensions:
    name: Extensions (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Other authors' sinks are a non-blocking check (ADR 0009): failures are annotated, releases are not gated.
    continue-on-error: ${{ matrix.mode == 'ThirdParty' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [InRepo, Published, ThirdParty]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Core
        run: |
          dotnet publish src/dotnet/PoShLog.Core.csproj -c Release -o src/lib --configfile build/nuget.config
          if ($LASTEXITCODE) { throw 'Core publish failed.' }
      - name: Build source extensions
        if: matrix.mode == 'InRepo'
        run: |
          Get-ChildItem extensions -Directory | ForEach-Object {
            ./build/Build-Extension.ps1 -Module $_.Name
          }
      - name: Build the unpublished sinks
        # Published mode loads them next to the published Seq 1.0.0 (docs/decisions/0012-otlp-sink-design.md).
        if: matrix.mode == 'Published'
        run: |
          ./build/Build-Extension.ps1 -Module PoShLog.Sinks.OpenTelemetry
          ./build/Build-Extension.ps1 -Module PoShLog.Sinks.Splunk.Hec
          ./build/Build-Extension.ps1 -Module PoShLog.Sinks.Syslog.Rfc5424
          ./build/Build-Extension.ps1 -Module PoShLog.Sinks.Elastic
      - name: Verify compatibility
        run: ./tests/compat/Invoke-Compatibility.ps1 -Mode '${{ matrix.mode }}'
