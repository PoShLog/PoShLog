name: Release

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module to publish
        required: true
        default: PoShLog
        type: choice
        options:
          - PoShLog
          - PoShLog.Sinks.Seq
          - PoShLog.Sinks.EventLog
          - PoShLog.Enrichers
          - PoShLog.Sinks.Http
          - PoShLog.Sinks.OpenTelemetry
          - PoShLog.Sinks.Splunk.Hec
          - PoShLog.Sinks.Syslog.Rfc5424
      version:
        description: Expected manifest version (e.g. 3.0.0 or 3.0.0-preview2)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  compatibility:
    uses: ./.github/workflows/compat.yml

  release:
    name: Test and publish selected module
    needs: compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate selection
        env:
          RELEASE_MODULE: ${{ inputs.module }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $allowed = @('PoShLog', 'PoShLog.Sinks.Seq', 'PoShLog.Sinks.EventLog', 'PoShLog.Enrichers', 'PoShLog.Sinks.Http', 'PoShLog.Sinks.OpenTelemetry', 'PoShLog.Sinks.Splunk.Hec', 'PoShLog.Sinks.Syslog.Rfc5424')
          if ($env:RELEASE_MODULE -notin $allowed) { throw 'Unknown module.' }
          if ($env:RELEASE_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+)?\z') { throw 'Invalid version.' }
          $directory = if ($env:RELEASE_MODULE -eq 'PoShLog') { 'src' } else { "extensions/$env:RELEASE_MODULE" }
          $manifest = Import-PowerShellDataFile "$directory/$env:RELEASE_MODULE.psd1"
          $version = [string]$manifest.ModuleVersion
          if ($manifest.PrivateData.PSData.Prerelease) { $version += '-' + $manifest.PrivateData.PSData.Prerelease }
          if ($version -cne $env:RELEASE_VERSION) { throw 'Version must match the committed manifest.' }
      - name: Build and test Core
        run: |
          dotnet build PoShLog.sln -c Release --configfile build/nuget.config
          if ($LASTEXITCODE) { throw 'Core build failed.' }
          dotnet test PoShLog.sln -c Release --no-build
          if ($LASTEXITCODE) { throw 'Core tests failed.' }
          dotnet publish src/dotnet/PoShLog.Core.csproj -c Release -o src/lib --no-restore
          if ($LASTEXITCODE) { throw 'Core publish failed.' }
      - name: Test PowerShell module
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0.0
          $env:TEMP = [IO.Path]::GetTempPath()
          $result = Invoke-Pester -Path ./tests -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { throw 'Pester failed.' }
      - name: Stage selected module
        env:
          RELEASE_MODULE: ${{ inputs.module }}
        run: |
          ./build/Stage-Module.ps1 -Module $env:RELEASE_MODULE
          if ($env:RELEASE_MODULE -ne 'PoShLog') {
            ./build/Stage-Module.ps1 -Module PoShLog
          }
      - name: Ensure PSResourceGet 1.1 or newer
        run: |
          if (!(Get-Module Microsoft.PowerShell.PSResourceGet -ListAvailable | Where-Object Version -ge ([version]'1.1.0'))) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Repository PSGallery -MinimumVersion 1.1.0 -Scope CurrentUser -Force -ErrorAction Stop
          }
          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.0 -Force -ErrorAction Stop
      - name: Publish selected module
        env:
          RELEASE_MODULE: ${{ inputs.module }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.0 -ErrorAction Stop
          $env:PSModulePath = (Join-Path $PWD 'artifacts') + [IO.Path]::PathSeparator + $env:PSModulePath
          # Keep dependency validation enabled: publish Core to PSGallery before extensions.
          Publish-PSResource -Path "artifacts/$env:RELEASE_MODULE" -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop
