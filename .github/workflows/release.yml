name: Release

# Pushing a tag publishes one module from the tagged commit (ADR 0018):
#   v3.0.0-preview2               -> PoShLog
#   PoShLog.Sinks.Seq/v2.0.0-preview2 -> that extension
# The version must match ModuleVersion (+ Prerelease) in the module's manifest, and the module's CHANGELOG must have a
# section for it. Publish PoShLog first: extensions are published with the dependency check against the Gallery.
# workflow_dispatch does the same once this file is on the default branch.
on:
  push:
    tags:
      - 'v3.*'
      - 'PoShLog.*/v*'
  workflow_dispatch:
    inputs:
      module:
        description: Module to publish
        required: true
        default: PoShLog
        type: choice
        options:
          - PoShLog
          - PoShLog.Sinks.Seq
          - PoShLog.Sinks.EventLog
          - PoShLog.Enrichers
          - PoShLog.Sinks.Http
          - PoShLog.Sinks.OpenTelemetry
          - PoShLog.Sinks.Splunk.Hec
          - PoShLog.Sinks.Syslog.Rfc5424
          - PoShLog.Sinks.Elastic
          - PoShLog.Sinks.MSSqlServer
      version:
        description: Expected manifest version (e.g. 3.0.0 or 3.0.0-preview2)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  compatibility:
    uses: ./.github/workflows/compat.yml

  release:
    name: Test and publish selected module
    needs: compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve and validate module and version
        env:
          INPUT_MODULE: ${{ inputs.module }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF_NAME -cmatch '^v(?<version>.+)\z') {
              $module = 'PoShLog'; $version = $Matches.version
            } elseif ($env:GITHUB_REF_NAME -cmatch '^(?<module>PoShLog\.[A-Za-z0-9.]+)/v(?<version>.+)\z') {
              $module = $Matches.module; $version = $Matches.version
            } else { throw "Unrecognised release tag: $env:GITHUB_REF_NAME" }
          } else {
            $module = $env:INPUT_MODULE; $version = $env:INPUT_VERSION
          }
          $allowed = @('PoShLog', 'PoShLog.Sinks.Seq', 'PoShLog.Sinks.EventLog', 'PoShLog.Enrichers', 'PoShLog.Sinks.Http', 'PoShLog.Sinks.OpenTelemetry', 'PoShLog.Sinks.Splunk.Hec', 'PoShLog.Sinks.Syslog.Rfc5424', 'PoShLog.Sinks.Elastic', 'PoShLog.Sinks.MSSqlServer')
          if ($module -cnotin $allowed) { throw "Unknown module: $module" }
          if ($version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+)?\z') { throw "Invalid version: $version" }
          $directory = if ($module -eq 'PoShLog') { 'src' } else { "extensions/$module" }
          $manifest = Import-PowerShellDataFile "$directory/$module.psd1"
          $expected = [string]$manifest.ModuleVersion
          if ($manifest.PrivateData.PSData.Prerelease) { $expected += '-' + $manifest.PrivateData.PSData.Prerelease }
          if ($expected -cne $version) { throw "Version $version does not match the committed manifest ($expected)." }
          $changelog = if ($module -eq 'PoShLog') { 'CHANGELOG.md' } else { "$directory/CHANGELOG.md" }
          if (-not (Select-String -Path $changelog -SimpleMatch "## $version ")) { throw "$changelog has no section for $version." }
          "RELEASE_MODULE=$module" >> $env:GITHUB_ENV
          "Publishing $module $version"
      - name: Build and test Core
        run: |
          dotnet build PoShLog.sln -c Release --configfile build/nuget.config
          if ($LASTEXITCODE) { throw 'Core build failed.' }
          dotnet test PoShLog.sln -c Release --no-build
          if ($LASTEXITCODE) { throw 'Core tests failed.' }
          dotnet publish src/dotnet/PoShLog.Core.csproj -c Release -o src/lib --no-restore
          if ($LASTEXITCODE) { throw 'Core publish failed.' }
      - name: Test PowerShell module
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0.0
          $env:TEMP = [IO.Path]::GetTempPath()
          $result = Invoke-Pester -Path ./tests -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { throw 'Pester failed.' }
      - name: Stage selected module
        run: |
          ./build/Stage-Module.ps1 -Module $env:RELEASE_MODULE
          if ($env:RELEASE_MODULE -ne 'PoShLog') {
            ./build/Stage-Module.ps1 -Module PoShLog
          }
      - name: Ensure PSResourceGet 1.1 or newer
        run: |
          if (!(Get-Module Microsoft.PowerShell.PSResourceGet -ListAvailable | Where-Object Version -ge ([version]'1.1.0'))) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Repository PSGallery -MinimumVersion 1.1.0 -Scope CurrentUser -Force -ErrorAction Stop
          }
          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.0 -Force -ErrorAction Stop
      - name: Publish selected module
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.0 -ErrorAction Stop
          $env:PSModulePath = (Join-Path $PWD 'artifacts') + [IO.Path]::PathSeparator + $env:PSModulePath
          # Keep dependency validation enabled: publish Core to PSGallery before extensions.
          Publish-PSResource -Path "artifacts/$env:RELEASE_MODULE" -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop
