<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300">
  <title>Console output of the quick start, and the same event as structured data</title>
  <style>
    text { font: 22px "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace; fill: #E6EDF3; white-space: pre; }
    .dim { fill: #8B949E; }
    .ps { fill: #79C0FF; }
    .str { fill: #A5D6FF; }
    .inf { fill: #7EE787; }
    .num { fill: #D2A8FF; }
    .key { fill: #FFA657; }
    .cap { font: 600 16px "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #8B949E; letter-spacing: 1.5px; }
  </style>
  <rect width="1280" height="300" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <circle cx="30" cy="28" r="7" fill="#FF5F57"/>
  <circle cx="54" cy="28" r="7" fill="#FEBC2E"/>
  <circle cx="78" cy="28" r="7" fill="#28C840"/>
  <text class="cap" x="1250" y="33" text-anchor="end">POWERSHELL 7.6</text>
  <text x="32" y="86"><tspan class="ps">PS&gt; </tspan>Write-InfoLog <tspan class="str">'Copied {Count} files to {Target}'</tspan> -PropertyValues <tspan class="num">42</tspan>, <tspan class="str">'D:\Backup'</tspan></text>
  <text x="32" y="124"><tspan class="dim">[12:41:07 </tspan><tspan class="inf">INF</tspan><tspan class="dim">] </tspan>Copied <tspan class="num">42</tspan> files to <tspan class="str">"D:\Backup"</tspan></text>
  <line x1="32" y1="160" x2="1248" y2="160" stroke="#30363D" stroke-width="2"/>
  <text class="cap" x="32" y="196">THE SAME EVENT AS A LOG SERVER SEES IT</text>
  <text x="32" y="240">{ <tspan class="key">"@t"</tspan>: <tspan class="str">"2026-11-03T12:41:07Z"</tspan>, <tspan class="key">"@mt"</tspan>: <tspan class="str">"Copied {Count} files to {Target}"</tspan>,</text>
  <text x="32" y="274">  <tspan class="key">"Count"</tspan>: <tspan class="num">42</tspan>, <tspan class="key">"Target"</tspan>: <tspan class="str">"D:\\Backup"</tspan> }</text>
</svg>
